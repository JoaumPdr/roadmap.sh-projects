<!DOCTYPE html>

<html lang="en">

<head>

    <!-- Basic Meta -->
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Home | Simple HTML Website</title>

    <meta
            name="description"
            content="Frontend developer portfolio built with semantic HTML only.">

    <meta
            name="keywords"
            content="HTML, Frontend Developer, Portfolio, Semantic HTML">

    <meta
            name="author"
            content="joaumpdr">

    <!-- Open Graph -->
    <meta
            property="og:title"
            content="Simple HTML Website">

    <meta
            property="og:description"
            content="Frontend developer portfolio built with semantic HTML only.">

    <meta
            property="og:type"
            content="website">

    <meta
            property="og:image"
            content="https://example.com/preview-image.png">

    <meta
            property="og:url"
            content="https://example.com">

</head>

<body>

<!-- Header -->
<header>

    <div>

        <h1>your name</h1>

    </div>

    <!-- Navigation -->
    <nav>

        <ul>

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="projects.html">Projects</a>
            </li>

            <li>
                <a href="articles.html">Articles</a>
            </li>

            <li>
                <a href="contact.html">Contact</a>
            </li>

        </ul>

    </nav>
<main>
    <section class="contact">
        <h1>Contact me</h1>
        <p>Feel free to reach out to me!</p>
    </section>

    <!-- Contact Form -->
    <section>

        <form action="#" method="post">

            <!-- Name -->
            <div>

                <label for="name">
                    Name
                </label>

                <br>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                        required>

            </div>

            <br>

            <!-- Email -->
            <div>

                <label for="email">
                    Email
                </label>

                <br>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

            </div>

            <br>

            <!-- Subject -->
            <div>

                <label for="subject">
                    Subject
                </label>

                <br>

                <input
                        type="text"
                        id="subject"
                        name="subject"
                        placeholder="Enter the subject"
                        required>

            </div>

            <br>

            <!-- Message -->
            <div>

                <label for="message">
                    Message
                </label>

                <br>

                <textarea
                        id="message"
                        name="message"
                        rows="8"
                        cols="40"
                        placeholder="Write your message here"
                        required>
                    </textarea>

            </div>

            <br>

            <!-- Submit Button -->
            <button type="submit">
                Send Message
            </button>

        </form>

    </section>

    <!-- Contact Information -->
    <section>

        <h2>Other Contact Information</h2>

        <address>

            Email:
            <a href="mailto:your@email.com">
                your@email.com
            </a>

            <br>

            GitHub:
            <a
                    href="https://github.com/JoaumPdr"
                    target="_blank"
                    rel="noopener noreferrer">

                github.com/JoaumPdr

            </a>

        </address>

    </section>
</main>
<footer>
    <p>&copy; all rights reserved 2024</p>
</footer>
</body>
</html>
